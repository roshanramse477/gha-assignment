name: Q1 Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string'
        required: true
        default: '1.0.0'
        type: string
      release_type:
        description: 'Type of release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.set_outputs.outputs.build_tag }}
      build_date: ${{ steps.set_outputs.outputs.build_date }}
    steps:
      - name: Compute Outputs
        id: set_outputs
        run: |
          BUILD_TAG="v${{ inputs.version }}-${{ inputs.release_type }}-${{ github.run_number }}"
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "build_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

  announce:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Print Outputs
        run: |
          echo "Build Tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build Date: ${{ needs.prepare.outputs.build_date }}"

      - name: Generate Summary Table
        run: |
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ inputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Type | ${{ inputs.release_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Tag | ${{ needs.prepare.outputs.build_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date | ${{ needs.prepare.outputs.build_date }} |" >> $GITHUB_STEP_SUMMARY
